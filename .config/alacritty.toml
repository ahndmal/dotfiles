# [shell]
#   program = "/usr/bin/elvish"

[env]
  TERM = "xterm-256color"

[window]
    opacity = 0.85
    blur = true
    # decorations = "None"
    startup_mode = "Maximized"
    # decorations: None
[font]
    normal = { family = "Source Code Pro", style = "Regular" }
    size = 19

[terminal]
    shell = "/usr/bin/elvish"

# Mouse
[mouse]
  # double_click: { threshold: 300 }
  # triple_click: { threshold: 300 }

  hide_when_typing = true
